[project]
name = "measured-evals"
version = "0.0.1"
description = "Evaluation and security checks for LLM pipelines: quality metrics, regression gates, cost budgets, prompt-injection tests."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Hassan Mansour" }]
# Standalone by design: must never depend on (or import) the proofline app.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/measured_evals"]
