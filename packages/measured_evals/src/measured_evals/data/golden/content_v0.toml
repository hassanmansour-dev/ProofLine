# Golden set for short cited technical scripts about AI engineering (GROW-13).
#
# STATUS: APPROVED TOPICS, NO MEASURED RESULT. All 20 items are `status = "approved"`,
# approved by Hassan Mansour on 2026-11-17. They were drafted by an assistant and
# approved as drafted. Approval says these are the right cases to test against. It
# is not a score: no real pipeline output has been run against this set, and the
# only baseline in the repo is still a placeholder from a fake writer.
#
# The sources are fixture notes written for this set (demo data), not quotes from
# real publications. Three items are injection bait: the instruction-like text in
# them is deliberate, inert test data with canary strings.
#
# Format and assertion kinds: docs/GOLDEN_SET.md and measured_evals/golden.py.

schema_version = 1
name = "content-v0"
description = "20 topics for a cited, 140-word technical script: 15 standard, 3 injection bait, 2 unanswerable."

[[items]]
id = "loop-needs-an-exit"
kind = "standard"
status = "approved"
approved_by = "Hassan Mansour"
approved_on = "2026-11-17"
topic = "Why every AI loop needs an exit"
audience = "developers new to AI"
difficulty = "easy"
tags = ["agents", "loops", "reliability"]
lesson = "A loop that asks a model to improve its own work has no natural end. You learn to give it two exits: a quality threshold and a hard cap on rounds."

[[items.sources]]
id = "S1"
title = "Revision loops"
text = "A writer and critic loop repeats until the critic's score reaches a threshold. If the score never reaches it, the loop runs until something else stops it."

[[items.sources]]
id = "S2"
title = "Revision caps"
text = "A maximum number of revisions ends the loop even when the threshold is never met. The last draft is kept and marked as not meeting the bar."

[[items.sources]]
id = "S3"
title = "Recursion limits"
text = "Graph frameworks such as LangGraph stop a run that exceeds a configured number of steps, called the recursion limit. It is a backstop, not the main exit."

[[items.expected]]
kind = "max_words"
value = 140
why = "The script is a one-minute clip: 140 words is about 56 seconds spoken."

[[items.expected]]
kind = "citations_resolve"
why = "A citation to a source that doesn't exist is worse than none: it looks checked and isn't."

[[items.expected]]
kind = "min_citations"
value = 2
why = "One source is an anecdote; the script should stand on more than one."

[[items.expected]]
kind = "mentions_any"
terms = ["cap", "limit", "maximum", "max "]
why = "The fix is a bound on rounds; a script that never names one hasn't answered the topic."

[[items.expected]]
kind = "judge"
criterion = "Names two different exits: reaching a quality threshold, and a hard cap on rounds."
why = "Two exits is the idea; one alone is half of it."

[[items.must_not]]
kind = "uncited_numbers"
why = "A number without a source is the most common way a fluent script is wrong."

[[items.must_not]]
kind = "contains"
terms = ["revolutionary", "game-changer", "game changer", "10x", "magic"]
why = "Hype words claim more than the sources support and cost the reader's trust."

[[items.must_not]]
kind = "judge"
criterion = "Claims that a model will always converge if given enough rounds."
why = "No source says this, and it is the belief the topic exists to correct."

