title = "Why fixed"
text = "Running the same inputs after every change makes a regression visible: an item that passed before and fails now."

[[items.sources]]
id = "S3"
title = "Size"
text = "A small set that is run on every change is more useful than a large set that is run rarely. Sets usually grow from real failures."

