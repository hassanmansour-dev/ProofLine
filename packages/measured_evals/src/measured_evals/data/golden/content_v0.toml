title = "Resuming"
text = "When LangGraph resumes a paused node, the node runs again from its start. Code before the pause therefore runs more than once."

[[items.sources]]
id = "S3"
title = "Idempotence"
text = "Code that may run more than once should be free of side effects or safe to repeat, so that a resume does not send or charge twice."

