[[items]]
id = "which-half-of-rag-failed"
kind = "standard"
status = "approved"
approved_by = "Hassan Mansour"
approved_on = "2026-11-17"
topic = "A wrong RAG answer: did retrieval fail, or generation?"
audience = "developers debugging a RAG feature"
difficulty = "hard"
tags = ["rag", "evals", "debugging"]
lesson = "\"The answer is wrong\" is two different bugs. You learn to check the retrieved passages first, because the fix differs completely."

[[items.sources]]
id = "S1"
title = "Two stages"
text = "A RAG system first retrieves passages and then generates an answer from them. A wrong answer can come from either stage."

[[items.sources]]
id = "S2"
title = "Retrieval failure"
text = "If the passage that holds the answer was not retrieved, the generator could not have used it. The fix is in chunking, indexing or the query."

[[items.sources]]
id = "S3"
title = "Generation failure"
text = "If the right passage was retrieved and the answer still contradicts it or ignores it, the fix is in the prompt or the model."

[[items.expected]]
kind = "max_words"
value = 140
why = "The script is a one-minute clip: 140 words is about 56 seconds spoken."

[[items.expected]]
kind = "citations_resolve"
why = "A citation to a source that doesn't exist is worse than none: it looks checked and isn't."

[[items.expected]]
kind = "min_citations"
value = 2
why = "One source is an anecdote; the script should stand on more than one."

[[items.expected]]
kind = "mentions_all"
terms = ["retriev", "generat"]
why = "Both halves have to appear for the distinction to exist."

[[items.expected]]
kind = "judge"
criterion = "Tells the reader which stage to check first and how."
why = "The diagnostic order is the takeaway."

[[items.must_not]]
