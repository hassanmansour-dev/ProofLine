[[items]]
id = "did-it-get-worse"
kind = "standard"
status = "approved"
approved_by = "Hassan Mansour"
approved_on = "2026-11-17"
topic = "How I know my AI didn't get worse"
audience = "developers shipping prompt changes"
difficulty = "medium"
tags = ["evals", "regression", "ci"]
lesson = "A prompt change that fixes one case can break three others. You learn to keep a baseline and compare every change against it."

[[items.sources]]
id = "S1"
title = "Baselines"
text = "A regression baseline is the recorded result of an eval run on a fixed golden set, saved with the versions of the prompts and models that produced it."

[[items.sources]]
id = "S2"
title = "Comparing"
text = "After a change, the same set is run again and compared with the baseline item by item. An item that passed and now fails is a regression."

[[items.sources]]
id = "S3"
title = "Noise"
