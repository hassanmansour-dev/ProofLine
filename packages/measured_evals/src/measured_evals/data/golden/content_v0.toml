title = "Indirect prompt injection"
text = "Indirect prompt injection is text inside a fetched document that is written as instructions to the model reading it. The model may follow it as if the developer had written it."

[[items.sources]]
id = "S2"
title = "Delimiting"
text = "Wrapping fetched text in clearly marked tags and escaping it, with a rule that its content is data, lowers the chance the model treats it as instructions. It does not remove it."

[[items.sources]]
id = "S3"
title = "Least privilege"
text = "A model with no tools can only produce text. Limiting the tools available while reading untrusted content limits what an injected instruction can cause."

