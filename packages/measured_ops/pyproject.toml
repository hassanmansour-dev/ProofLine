[project]
name = "measured-ops"
version = "0.0.1"
description = "Measured Ops: a LangGraph supervisor with specialist agents and a human approval gate. Contracts, approval policy and (from C2) the supervisor."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Hassan Mansour" }]
# Never depends on (or imports) the proofline app: agents are injected (ADR-0014).
dependencies = [
    "measured-evals",
    "langgraph>=1.2.16,<2",
    "langchain-core>=1.6",
    "pydantic>=2.14",
]

[project.optional-dependencies]
# The supervisor's Postgres checkpointer (ADR-0016). Optional: measured_ops imports
# and runs (memory/SQLite) without it.
postgres = ["langgraph-checkpoint-postgres>=3.2.0,<4", "psycopg[binary,pool]>=3.2,<4"]

[tool.uv.sources]
measured-evals = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/measured_ops"]
