# Demo model prices (public), US dollars per million tokens, Anthropic first-party API.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-11-14).
# Cache writes are 1.25x input for the 5-minute TTL and 2x for 1 hour. Re-check the page
# when models change; real prices go in measured-ops-private if they ever differ.
# A model missing here is priced "unknown" in the inbox, never free.
#
# Cache reads differ by model: 0.1x input on Haiku 5.5, 0.05x on Opus 5.5 ($0.20) and
# Sonnet 5.5 ($0.10), 0.025x on Fable 5.1 ($0.25), as published; not a typo.
#
# input: uncached input. cache_read / cache_write_*: prompt-cache tokens, counted
# apart from input (measured_evals.cost).

version = 1

[models.claude-opus-5-5]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write_5m = 5.00
cache_write_1h = 8.00

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.10
cache_write_5m = 2.50
cache_write_1h = 4.00

# Prompts up to 100,000 tokens.
[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write_5m = 0.125
cache_write_1h = 0.20

[models.claude-fable-5-1]
input = 10.00
output = 50.00
cache_read = 0.25
cache_write_5m = 12.50
cache_write_1h = 20.00
