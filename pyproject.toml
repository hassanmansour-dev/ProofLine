[project]
name = "proofline"
version = "0.0.1"
description = "Proofline: a multi-agent content pipeline where nothing ships without passing the evals and a human sign-off."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Hassan Mansour" }]
dependencies = [
    "langgraph>=1.2.16,<2",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "langchain-core>=1.6",
    "langchain-anthropic>=1.7",
    "langsmith>=0.14",
    "tavily-python>=0.8.5",
    "aiosqlite>=0.20",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "fastapi>=0.156",
    "uvicorn[standard]>=0.54",
    "typer>=0.16",
    "rich>=14",
    "pyyaml>=6",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=3.2.0", "psycopg[binary,pool]>=3.2"]

[project.scripts]
proofline = "proofline.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "anyio>=4.6",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"src/proofline/cli.py" = ["T20"]
".claude/hooks/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tavily.*", "aiosqlite.*", "langgraph.checkpoint.postgres.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls real LLM/search APIs (needs keys, costs money); run with -m live",
]
xfail_strict = true
