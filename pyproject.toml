# uv workspace root. Not a package itself: it pins the dev toolchain and holds the
# shared ruff / mypy / pytest config for every member under packages/
# (proofline, measured_ops, measured_evals; ADR-0012, ADR-0014).
[project]
name = "proofline-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["proofline", "measured-ops", "measured-evals"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
proofline = { workspace = true }
measured-ops = { workspace = true }
measured-evals = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "anyio>=4.6",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-pyyaml",
    "aiosqlite>=0.22.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pre-commit>=4.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "T20"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["proofline", "measured_ops", "measured_evals", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["T20"]
"packages/proofline/src/proofline/cli.py" = ["T20"]
".claude/hooks/**" = ["T20"]
"scripts/pii_scan.py" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/proofline/src", "packages/measured_ops/src", "packages/measured_evals/src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tavily.*", "aiosqlite.*", "langgraph.checkpoint.postgres.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/proofline/tests",
    "packages/measured_ops/tests",
    "packages/measured_evals/tests",
    "scripts",
]
addopts = "-ra --strict-markers"
markers = [
    "live: calls real LLM/search APIs (needs keys, costs money); run with -m live",
]
xfail_strict = true
