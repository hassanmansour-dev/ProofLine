# Ubuntu option: stop the machine sleeping, so "always on" holds. System-level (needs sudo):
#   sudo install -D -m 644 measured-ops-no-sleep.conf /etc/systemd/sleep.conf.d/measured-ops.conf
# and, on a laptop, make closing the lid do nothing while on power:
#   sudo install -D -m 644 measured-ops-logind.conf /etc/systemd/logind.conf.d/measured-ops.conf
# then `sudo systemctl restart systemd-logind` (this ends graphical sessions: do it from SSH or
# at a moment you can lose the desktop).
[Sleep]
AllowSuspend=no
AllowHibernate=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
