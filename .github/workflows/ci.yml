# Fast checks on every push and PR, across every workspace package
# (packages/proofline, packages/measured_ops, packages/measured_evals):
# lint, format, types, unit tests.
# No secrets and no network calls beyond installing deps — live tests are excluded.
# Evals (DeepEval, promptfoo) get their own workflow in GROW-14.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # Same checks as .pre-commit-config.yaml, run here so a skipped hook can't let
    # a secret or personal data into this public repo (C0, GROW-91).
    name: secret + PII scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"
      # Pinned here, not read from the release, so a swapped asset fails the check.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip

      - name: gitleaks, full history (pinned, checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --no-banner .

      - name: PII scan, every tracked file
        run: git ls-files -z -- . ':!uv.lock' ':!scripts/test_pii_scan.py' | xargs -0 python3 scripts/pii_scan.py

  checks:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The supervisor's e2e case (C2, ADR-0016) resumes from a Postgres checkpoint.
    # Throwaway service container: CI-only credentials, nothing real behind them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ops_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # test_ops_e2e.py fails (never skips) its Postgres case in CI without this.
      MEASURED_OPS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ops_e2e
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (Python from .python-version, deps from uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict, every package's src/)
        run: uv run mypy

      - name: Fast tests, every package (no keys; network only to the Postgres service)
        run: uv run pytest -m "not live"

      - name: measured_evals stands alone (installed without proofline or measured_ops)
        run: >-
          uv run --isolated --no-project --reinstall-package measured-evals
          --with ./packages/measured_evals --with pytest
          python -m pytest -q -p no:cacheprovider packages/measured_evals/tests

      - name: measured_ops stands alone (installed without proofline, with its postgres extra)
        run: >-
          uv run --isolated --no-project
          --reinstall-package measured-ops --reinstall-package measured-evals
          --with ./packages/measured_evals --with './packages/measured_ops[postgres]'
          --with pytest --with anyio --with aiosqlite --with langgraph-checkpoint-sqlite
          python -m pytest -q -p no:cacheprovider packages/measured_ops/tests
