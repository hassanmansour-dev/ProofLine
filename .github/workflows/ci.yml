# Fast checks on every push and PR, across every workspace package
# (packages/proofline, packages/measured_ops, packages/measured_evals):
# lint, format, types, unit tests.
# No secrets and no network calls beyond installing deps — live tests are excluded.
# Evals (DeepEval, promptfoo) get their own workflow in GROW-14.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (Python from .python-version, deps from uv.lock)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict, every package's src/)
        run: uv run mypy

      - name: Fast tests, every package (no network, no keys)
        run: uv run pytest -m "not live"

      - name: measured_evals stands alone (installed without proofline or measured_ops)
        run: >-
          uv run --isolated --no-project --reinstall-package measured-evals
          --with ./packages/measured_evals --with pytest
          python -m pytest -q -p no:cacheprovider packages/measured_evals/tests

      - name: measured_ops stands alone (installed without proofline)
        run: >-
          uv run --isolated --no-project
          --reinstall-package measured-ops --reinstall-package measured-evals
          --with ./packages/measured_evals --with ./packages/measured_ops
          --with pytest --with anyio --with aiosqlite --with langgraph-checkpoint-sqlite
          python -m pytest -q -p no:cacheprovider packages/measured_ops/tests
